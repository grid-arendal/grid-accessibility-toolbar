name: Publish tested plugin release
on:
  create:
  workflow_dispatch:
    inputs:
      version:
        description: Stable plugin version (must match source headers and readme)
        required: true
        default: '2.0.2'
permissions:
  contents: write
concurrency:
  group: grid-stable-release
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - name: Resolve explicitly requested release version
        env:
          MANUAL_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ github.event.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$MANUAL_VERSION"
          else
            version="${RELEASE_REF#release/}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then exit 1; fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Validate PHP syntax and update policy
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          php tests/php-unit.php
          php tests/modules.php
          node --check assets/toolbar.js
          node --check assets/workspace.js
          php tests/updater/public-updates.php
      - name: Build and validate installable ZIP
        run: python3 tools/build-release.py --source . --output dist --version "$RELEASE_VERSION"
      - name: Publish stable release
        run: |
          gh release create "v${RELEASE_VERSION}" \
            "dist/grid-accessibility-toolbar-${RELEASE_VERSION}.zip" dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "GRID Accessibility Toolbar ${RELEASE_VERSION}" \
            --notes-file RELEASE-NOTES.md
      - name: Publish update feed after successful release
        run: python3 tools/publish-metadata.py
