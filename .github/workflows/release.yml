name: Publish tested plugin release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable plugin version (must match source headers and readme)
        required: true
        default: '1.10.0'
permissions:
  contents: write
concurrency:
  group: grid-release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP syntax and updater policy
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          php tests/php-unit.php
          php tests/updater/private-updates.php
      - name: Build and validate installable ZIP
        run: python3 tools/build-release.py --source . --output dist --version "$RELEASE_VERSION"
      - name: Publish stable private release
        run: |
          gh release create "v${RELEASE_VERSION}" \
            "dist/grid-accessibility-toolbar-${RELEASE_VERSION}.zip" dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "GRID Accessibility Toolbar ${RELEASE_VERSION}" \
            --notes-file RELEASE-NOTES.md
